<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мои задачи</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
    { "imports": { "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js" } }
  </script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800">
  <div class="fixed inset-0 -z-10 bg-cover bg-center" style="background-image: url('https://cdn.discordapp.com/attachments/1533500383542902959/1553043364210020463/IMG_2574.png?ex=6ac06198&is=6abf1018&hm=cff4f7233980350da7acdea9bbdc8ab58119116c59219803111b96bc2559ce3a&');"></div>
  <div class="fixed inset-0 -z-10 bg-white/75 backdrop-blur-[2px]"></div>

  <main id="app" class="relative mx-auto w-full max-w-2xl px-4 py-12 sm:py-20" v-cloak>
    <header class="mb-7 flex items-start justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Мои задачи</h1>
        <p class="mt-2 text-sm capitalize text-slate-400">{{ formattedDate }}</p>
      </div>
      <span class="rounded-xl bg-violet-100 px-3 py-2 text-sm font-semibold text-violet-700">{{ tasks.length }} {{ plural(tasks.length) }}</span>
    </header>

    <section class="overflow-hidden rounded-2xl border border-slate-100 bg-white shadow-xl shadow-slate-200/40">
      <form class="flex gap-3 border-b border-slate-100 p-4" @submit.prevent="addTask">
        <input v-model="newTask" type="text" maxlength="120" autocomplete="off" autofocus placeholder="Что нужно сделать?" class="min-w-0 flex-1 rounded-xl bg-slate-100 px-4 py-3 outline-none placeholder:text-slate-400 focus:ring-2 focus:ring-violet-300" />
        <button class="rounded-xl bg-violet-600 px-5 font-semibold text-white transition hover:bg-violet-700 active:scale-95" type="submit">Добавить</button>
      </form>

      <ul class="px-4" v-if="tasks.length">
        <li v-for="(task, index) in tasks" :key="task.id" class="group flex min-h-[62px] items-center gap-3 border-b border-slate-100 last:border-0">
          <input v-model="task.done" type="checkbox" class="h-5 w-5 shrink-0 cursor-pointer accent-violet-600" :aria-label="`Отметить: ${task.text}`" />
          <span class="flex-1 text-sm" :class="task.done && 'text-slate-400 line-through'">{{ task.text }}</span>
          <button @click="removeTask(index)" class="p-2 text-xl leading-none text-slate-300 opacity-100 transition hover:text-rose-500 sm:opacity-0 sm:group-hover:opacity-100" :aria-label="`Удалить: ${task.text}`">×</button>
        </li>
      </ul>
      <p v-else class="py-9 text-center text-sm text-slate-400">Список задач пока пуст</p>

      <footer class="flex items-center justify-between border-t border-slate-100 px-4 py-4 text-sm text-slate-400">
        <span>{{ activeCount ? `${activeCount} ${plural(activeCount)} осталось` : 'Нет активных задач' }}</span>
        <button @click="clearCompleted" type="button" class="transition hover:text-violet-600">Очистить выполненные</button>
      </footer>
    </section>
  </main>

  <script type="module">
    import { createApp, computed, ref, watch } from 'vue';

    const storageKey = 'vue-todo-tasks';
    const defaults = [
      { id: 1, text: 'Ответить на письма', done: false },
      { id: 2, text: 'Запланировать тренировку', done: false },
      { id: 3, text: 'Купить продукты', done: true }
    ];

    let savedTasks = defaults;
    try { savedTasks = JSON.parse(localStorage.getItem(storageKey)) || defaults; } catch { /* use defaults */ }

    createApp({
      setup() {
        const tasks = ref(savedTasks.map((task, index) => ({ ...task, id: task.id ?? Date.now() + index })));
        const newTask = ref('');
        const activeCount = computed(() => tasks.value.filter(task => !task.done).length);
        const formattedDate = new Intl.DateTimeFormat('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
        const plural = count => count % 10 === 1 && count % 100 !== 11 ? 'дело' : count % 10 >= 2 && count % 10 <= 4 && (count % 100 < 12 || count % 100 > 14) ? 'дела' : 'дел';

        watch(tasks, value => localStorage.setItem(storageKey, JSON.stringify(value)), { deep: true });
        const addTask = () => {
          const text = newTask.value.trim();
          if (!text) return;
          tasks.value.unshift({ id: Date.now(), text, done: false });
          newTask.value = '';
        };
        const removeTask = index => tasks.value.splice(index, 1);
        const clearCompleted = () => { tasks.value = tasks.value.filter(task => !task.done); };

        return { tasks, newTask, activeCount, formattedDate, plural, addTask, removeTask, clearCompleted };
      }
    }).mount('#app');
  </script>
</body>
</html>
